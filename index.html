<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to My Simple Web App</h1>
            <p>A simple interactive counter application</p>
        </header>
        
        <main>
            <div class="card">
                <h2>Counter App</h2>
                <div class="counter-display">
                    <span id="counter">0</span>
                </div>
                <div class="button-group">
                    <button id="decrementBtn" class="btn btn-danger">-</button>
                    <button id="resetBtn" class="btn btn-secondary">Reset</button>
                    <button id="incrementBtn" class="btn btn-success">+</button>
                </div>
            </div>
            
            <div class="card">
                <h2>About</h2>
                <p>This is a simple web application built with HTML, CSS, and JavaScript.</p>
                <p>Use the buttons above to increment, decrement, or reset the counter!</p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 Simple Web App | Built with ❤️</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
